[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "seedpea-mcp-adapter"
version = "0.3.0"
description = "Bounded SeedPEA MCP adapter with an independently installable foundation"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  {name = "Christopher Daniel Pang"},
]
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "seedpea-foundation==0.2.0",
  "mcp==1.28.0",
]

[project.urls]
Homepage = "https://branchlinesystems.com/seedpea"
Repository = "https://github.com/Grativy6/seedpea-mcp-adapter"
Issues = "https://github.com/Grativy6/seedpea-mcp-adapter/issues"

[project.scripts]
seedpea-mcp-adapter = "seedpea_adapter.server:main"

[tool.setuptools.package-dir]
"" = "."

[tool.setuptools.packages.find]
where = ["."]
include = ["seedpea_adapter"]
namespaces = false
